<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keystone Hardscapes Chat</title>
    <link rel="stylesheet" href="bot-widget.css">
    <script src="bot-widget.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Keystone Hardscapes Assistant</h2>
            <p>Ask us about landscaping services</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    Hi! I'm here to help you with information about Keystone Hardscapes services. How can I assist you today?
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your message..." 
                class="chat-input"
            >
            <button id="sendButton" class="send-button">Send</button>
        </div>
    </div>

    
</body>
</html>
